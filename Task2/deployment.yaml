apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-test-app
  labels:
    app: insuretech-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-test-app
  template:
    metadata:
      labels:
        app: insuretech-test-app
    spec:
      containers:
        - name: insuretech-test-app
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "10Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20