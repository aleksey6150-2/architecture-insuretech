schema {
  query: Query
}

"""
Корневой тип запросов client-info.
"""
type Query {
  """
  Получить карточку клиента по ID.

  Аналог REST:
  GET /clients/{id}

  Через вложенные поля можно дополнительно получить документы и родственников клиента.
  """
  client(id: ID!): Client

  """
  Получить список документов клиента по ID клиента.

  Аналог REST:
  GET /clients/{id}/documents
  """
  clientDocuments(clientId: ID!): [Document!]!

  """
  Получить список родственников клиента по ID клиента.

  Аналог REST:
  GET /clients/{id}/relatives
  """
  clientRelatives(clientId: ID!): [Relative!]!
}

"""
Клиент.
Соответствует сущности Client из REST API.
"""
type Client {
  """
  Уникальный идентификатор клиента.
  """
  id: ID!

  """
  Имя клиента.
  """
  name: String

  """
  Возраст клиента.
  """
  age: Int

  """
  Документы клиента.

  Позволяет получить документы в рамках одного GraphQL-запроса вместе с данными клиента.
  """
  documents: [Document!]!

  """
  Родственники клиента.

  Позволяет получить родственников в рамках одного GraphQL-запроса вместе с данными клиента.
  """
  relatives: [Relative!]!
}

"""
Документ клиента.
Соответствует сущности Document из REST API.
"""
type Document {
  """
  Уникальный идентификатор документа.
  """
  id: ID!

  """
  Тип документа.
  Например: passport, driver_license, snils.
  """
  type: String

  """
  Номер документа.
  """
  number: String

  """
  Дата выдачи документа.
  Формат: ISO 8601 date.
  """
  issueDate: String

  """
  Дата окончания срока действия документа.
  Формат: ISO 8601 date.
  """
  expiryDate: String
}

"""
Родственник клиента.
Соответствует сущности Relative из REST API.
"""
type Relative {
  """
  Уникальный идентификатор записи о родственнике.
  """
  id: ID!

  """
  Тип родственной связи.
  Например: spouse, child, parent.
  """
  relationType: String

  """
  Имя родственника.
  """
  name: String

  """
  Возраст родственника.
  """
  age: Int
}